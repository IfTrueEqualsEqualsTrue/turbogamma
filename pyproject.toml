[project]
name = "turbogamma"
version = "0.0.1"
description = "Radiotherapy gamma index computation tool"
readme = "README.md"
authors = [
    { name = "gbo", email = "141006751+IfTrueEqualsEqualsTrue@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "python-dotenv>=1.2.2",
    "scipy>=1.18.0",
]

[project.scripts]
turbogamma = "turbogamma:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.2.3",
    "scipy-stubs>=1.18.0.1",
]
pmp = [
    "pymedphys[tests]==0.41.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
